{%extends "base.html"%}
{%block contenido%}
<form method="get" , action="/puestos">
<div class="mx-auto mt-4" style="max-width: 700px;">
    <div class="row g-3">
        <div class="mx-auto" style="width: 600px;">
            <label class="form-label fw-bold">Puesto</label>
            <input type="text" class="form-control" name="puesto" placeholder="Puesto" required>
        </div>
    </div>
<div class="mt-3 d-flex">
    <div class="d-grid mx-3 align-content-md-center" style="width: 200px;">
        <button type="submit" class="btn btn-outline-primary" >BUSCAR PUESTO</button>
    </div>
    <div class="d-grid mx-2 align-content-md-center  " style="width: 200px;">
        <button type="submit" class="btn btn-outline-primary" formmethod="post" formaction="/nuevo_puestos"  >AÑADIR PUESTO</button>
    </div>
    <div class="d-grid mx-2 align-content-md-center  " style="width: 200px;">
        <button type="submit" class="btn btn-outline-primary" formmethod="post" formaction="/eliminar_puestos"  >ELIMINAR PUESTO</button>
    </div>
</div>
{%if diccionario_respuesta.info %}
<div class="alert alert-dismissible alert-secondary mt-3 mb-2">
  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  <strong>Info</strong> {{diccionario_respuesta.info}}</a>.
</div>
{%endif%}
</div> 
<h2 class="text-center mt-5 mb-3 display-6">RESULTADOS</h2> 
</div>

</form>  

<div >
    <table class="table table-hover mx-auto" style="width: 900px;">
  <thead>
    <tr>
      <th scope="col">ID PUESTO</th>
      <th scope="col">PUESTO</th>
    </tr>
  </thead>
  <tbody>
    {%for puesto in diccionario_respuesta.lista_puestos%}
    <tr class="{{loop.cycle("table-secondary" , "table-default")}}">
      <td>{{puesto.id}}</td>
      <td>{{puesto.puesto|title}}</td>
      
    
    </tr>
    {%endfor%} 
  </tbody>
</table>
</div>
{%endblock contenido%}
